<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Blue rounded background -->
  <rect width="32" height="32" rx="6" fill="#276df1"/>
  <!-- Base -->
  <line x1="10" y1="26" x2="22" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Pillar -->
  <line x1="16" y1="10" x2="16" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Beam -->
  <line x1="6" y1="10" x2="26" y2="10" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Pivot -->
  <circle cx="16" cy="10" r="2" fill="white"/>
  <!-- Left string -->
  <line x1="7" y1="10" x2="7" y2="19" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right string -->
  <line x1="25" y1="10" x2="25" y2="19" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left pan -->
  <path d="M 4 19 Q 7 23 10 19" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Right pan -->
  <path d="M 22 19 Q 25 23 28 19" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
